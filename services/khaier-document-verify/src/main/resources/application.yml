server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: khaier-document-verify

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:document_verify}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Riyadh
    username: ${DB_USER:doc_verify_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: /opt/khaier-verify/logs/app.log
  level:
    root: INFO
    sa.khaier.verify: INFO
